<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 232" role="img" aria-labelledby="title desc">
  <title id="title">PokerNode logo color options</title>
  <desc id="desc">Four PokerNode linked-card logo color directions: deep indigo, electric cobalt, dusk plum, and porcelain</desc>
  <defs>
    <linearGradient id="option-indigo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#37346F"/>
      <stop offset="1" stop-color="#182A46"/>
    </linearGradient>
    <linearGradient id="option-cobalt" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#246FDB"/>
      <stop offset="1" stop-color="#213A72"/>
    </linearGradient>
    <linearGradient id="option-plum" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#70405F"/>
      <stop offset="1" stop-color="#30284F"/>
    </linearGradient>
    <linearGradient id="option-porcelain" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF4E4"/>
      <stop offset="1" stop-color="#E8E6F7"/>
    </linearGradient>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#20243B" flood-opacity=".08"/>
    </filter>
  </defs>

